name: Build ROTT64 first-level candidate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LIBDRAGON_REF: trunk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run host validation
        run: make test-host

      - name: Prepare full Dark War music assets
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y timidity freepats ffmpeg
          python3 tools/extract_music.py \
            filesystem/rott/DARKWAR.WAD \
            assets/music \
            platform/n64/n64_music_map_generated.h \
            --mode full
          bash tools/render_music.sh assets/music

      - name: Fetch pinned Taradino source
        run: bash tools/fetch_taradino.sh

      - name: Fetch ROTTDS reference source
        continue-on-error: true
        run: bash tools/fetch_rottds.sh

      - name: Prepare N64 engine tree
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          make prepare 2>&1 | tee build/reports/prepare-engine.log

      - name: Fix Dark War strict format compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("generated/rott/rt_actor.c")
          s = p.read_text()
          old = 'SoftError("\\n follower %d temp1 set to %4x, temp2 set to %4x",'
          new = 'SoftError("\\n follower %d temp1 set to %4lx, temp2 set to %4lx",'
          if old not in s:
              raise SystemExit("Expected rt_actor.c legacy format string not found")
          p.write_text(s.replace(old, new, 1))
          print("Patched rt_actor.c legacy fixed/long format mismatch")
          PY

      - name: Run engine preflight
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          make preflight 2>&1 | tee build/reports/preflight.log

      - name: Generate source and WAD reports
        run: |
          make reports
          cp assets/music/music-map.json build/reports/music-map.json

      - name: Record source revisions
        run: |
          mkdir -p build/reports
          cp vendor/taradino/source/.rott64-upstream-commit \
            build/reports/taradino-upstream-commit.txt
          if [ -f vendor/rottds/source/.rott64-version ]; then
            cp vendor/rottds/source/.rott64-version \
              build/reports/rottds-reference-version.txt
          fi

      - name: Cross-compile Nintendo 64 ROM
        id: n64_build
        continue-on-error: true
        shell: bash
        run: |
          # Keep CI diagnostics outside build/. The N64 Makefile may remove
          # build/ during cleanup, which previously unlinked n64-build.log.
          mkdir -p ci-reports
          cp -a build/reports/. ci-reports/ 2>/dev/null || true

          # Record whether a structurally valid ROM exists even if Docker or
          # make returns a non-zero status after producing it.
          set +e
          set -o pipefail
          docker run --rm \
            -e LIBDRAGON_REF="$LIBDRAGON_REF" \
            -v "$PWD:/project" \
            -w /project \
            ghcr.io/dragonminded/libdragon:latest \
            sh -lc '
              set -eux
              rm -rf /tmp/libdragon
              git clone --depth 1 --branch "$LIBDRAGON_REF" \
                https://github.com/DragonMinded/libdragon.git /tmp/libdragon
              make -C /tmp/libdragon -j2 install tools-install
              make -j2
            ' 2>&1 | tee ci-reports/n64-build.log
          build_status=${PIPESTATUS[0]}
          set -e

          if python3 -c 'from pathlib import Path; p = Path("rott64-diag.z64"); data = p.read_bytes() if p.is_file() else b""; ok = len(data) >= 4096 and data[:4] == bytes.fromhex("80371240"); print(f"Validated {p} ({len(data)} bytes)") if ok else None; raise SystemExit(0 if ok else 1)'
          then
            sha256sum rott64-diag.z64 | tee rott64-diag.z64.sha256
            echo "diag_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "diag_built=false" >> "$GITHUB_OUTPUT"
          fi

          if python3 -c 'from pathlib import Path; p = Path("rott64.z64"); data = p.read_bytes() if p.is_file() else b""; ok = len(data) >= 1024 * 1024 and data[:4] == bytes.fromhex("80371240"); print(f"Validated {p} ({len(data)} bytes)") if ok else None; raise SystemExit(0 if ok else 1)'
          then
            sha256sum rott64.z64 | tee rott64.z64.sha256
            echo "rom_built=true" >> "$GITHUB_OUTPUT"
            echo "A valid full .z64 exists; treating the cross-build as successful."
            exit 0
          fi

          echo "rom_built=false" >> "$GITHUB_OUTPUT"
          if [ "$build_status" -eq 0 ]; then
            build_status=1
          fi
          exit "$build_status"

      - name: Upload diagnostic boot ROM
        if: always() && steps.n64_build.outputs.diag_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rott64-mupen-boot-diagnostic
          path: |
            rott64-diag.z64
            rott64-diag.z64.sha256
          if-no-files-found: error

      - name: Name final Dark War ROM
        if: always() && steps.n64_build.outputs.rom_built == 'true'
        run: |
          cp rott64.z64 rott64-darkwar-r30.z64
          cp rott64.z64.sha256 rott64-darkwar-r30.z64.sha256

      - name: Verify final ROM size
        if: always() && steps.n64_build.outputs.rom_built == 'true'
        shell: bash
        run: |
          test -f rott64-darkwar-r30.z64
          bytes=$(stat -c%s rott64-darkwar-r30.z64)
          echo "Final ROM size: $bytes bytes"
          test "$bytes" -le 78000000

      - name: Upload Dark War ROM only
        if: always() && steps.n64_build.outputs.rom_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rott64-darkwar-r30
          path: rott64-darkwar-r30.z64
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload diagnostics and ROM backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rott64-first-level-build-diagnostics
          path: |
            ci-reports/
            build/reports/
            generated/rott/.rott64-prepared
            rott64-darkwar-r30.z64
            rott64-darkwar-r30.z64.sha256
            rott64-diag.z64
            rott64-diag.z64.sha256
          if-no-files-found: warn

      - name: Mark cross-build failure
        if: steps.n64_build.outputs.rom_built != 'true'
        run: |
          echo "The host/preflight stages passed, but no valid N64 ROM was produced."
          echo "Download rott64-first-level-build-diagnostics and inspect n64-build.log."
          exit 1
