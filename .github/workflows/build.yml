# r60f combined controls + stock video trigger: 2026-07-23T01:46:16Z
# r50j report guard refresh: force fresh workflow push
name: Build ROTT64 Dark War registered

on:
  push:
    branches:
      - software-controls
  workflow_dispatch:
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate bundled Dark War data
        shell: bash
        run: |
          set -eux
          test -s filesystem/rott/DARKWAR.WAD
          test -s filesystem/rott/DARKWAR.RTL
          test -s filesystem/rott/DARKWAR.RTC
          test ! -e filesystem/rott/HUNTBGIN.WAD

      - name: Run host validation
        run: |
          make test-host

      # ROTT64_FULL_MUSIC_CACHE_V1_PREPARED_RESTORE
      - name: Restore prepared full Dark War music cache
        id: music-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            assets/music
            platform/n64/n64_music_map_generated.h
          key: rott64-darkwar-rendered-music-v1-${{ hashFiles('filesystem/rott/DARKWAR.WAD', 'tools/extract_music.py', 'tools/render_music.sh') }}

      - name: Install music preparation tools
        if: steps.music-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y timidity freepats ffmpeg

      - name: Prepare full Dark War music assets
        if: steps.music-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python3 tools/extract_music.py \
            filesystem/rott/DARKWAR.WAD \
            assets/music \
            platform/n64/n64_music_map_generated.h \
            --mode full
          bash tools/render_music.sh assets/music

      # ROTT64_FULL_MUSIC_CACHE_V1_PREPARED_SAVE
      - name: Save prepared full Dark War music cache
        if: steps.music-cache.outputs.cache-hit != 'true' && hashFiles('assets/music/*.wav') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            assets/music
            platform/n64/n64_music_map_generated.h
          key: rott64-darkwar-rendered-music-v1-${{ hashFiles('filesystem/rott/DARKWAR.WAD', 'tools/extract_music.py', 'tools/render_music.sh') }}

      - name: Fetch pinned Taradino source
        run: |
          bash tools/fetch_taradino.sh

      - name: Fetch ROTTDS reference source
        continue-on-error: true
        run: |
          bash tools/fetch_rottds.sh

      - name: Prepare unmodified registered N64 engine tree
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          make prepare 2>&1 | tee build/reports/prepare-engine.log
          # R45d generated rt_cfg SDL guard
          if grep -q 'SDL_SCANCODE_' generated/rott/rt_cfg.c; then
            grep -Fq '#include "SDL.h"' generated/rott/rt_cfg.c || {
              echo "generated rt_cfg.c uses SDL_SCANCODE_* without SDL.h" >&2
              exit 1
            }
          fi
          if [ -f generated/reports/r45c-save-reader-owners.txt ]; then
            if [ -f generated/reports/r45c-save-reader-owners.txt ]; then cp generated/reports/r45c-save-reader-owners.txt build/reports/; else echo 'WARN: optional report missing: generated/reports/r45c-save-reader-owners.txt'; fi
          fi
          if [ -f generated/reports/r43-sd-startup-trace-map.txt ]; then
            if [ -f generated/reports/r43-sd-startup-trace-map.txt ]; then cp generated/reports/r43-sd-startup-trace-map.txt build/reports/; else echo 'WARN: optional report missing: generated/reports/r43-sd-startup-trace-map.txt'; fi
          fi

      - name: Verify clean registered preparation
        shell: bash
        run: |
          set -eux
          ! grep -q -- '-DSHAREWARE=1' Makefile
          ! grep -q 'ROTT_REGISTERED' tools/prepare_engine.py
          ! grep -q 'PopulateEpisodeMenu' tools/prepare_engine.py
          python3 tools/r49_patch_analog.py generated/rott
          python3 tools/r57_patch_native_buttons.py generated/rott
          python3 tools/r59_stock_video_menu.py generated/rott
          grep -q 'ROTT64_R85_DETAIL_FILTER_MENU' generated/rott/rt_menu.c
          grep -q 'ROTT64_NATIVE_BUTTONPOLL_DIRECT_R57' generated/rott/rt_playr.c
          grep -q 'ROTT64_STOCK_VIDEO_OPTIONS_MENU_R59' generated/rott/rt_menu.c
          grep -R -q 'ROTT64_STOCK_VIDEO_OPTIONS_BACKEND_R59' platform/n64
          ! grep -q 'ROTT64_START_DIRECT_EX_TITLES' generated/rott/rt_main.c generated/rott/rt_playr.c 2>/dev/null
          ! grep -R -q 'relative_x += n64_mouse_axis(input.stick_x);' platform/n64
          ! grep -R -q 'relative_y -= n64_mouse_axis(input.stick_y);' platform/n64
          ! grep -R -q 'rott64_video_r58_menu_controls(buttons, pressed)' platform/n64
          mkdir -p build/reports
          test -f generated/rott/.rott64-prepared

          # R48 V14: validate and retain the REAL generated control source
          grep -q 'ROTT64_NATIVE_GAMEPAD_XY_ENGINE_V3_SOURCE_AWARE' generated/rott/rt_playr.c
          mkdir -p build/reports
          if [ -f generated/reports/r48-v12-PollControls-before.c ]; then cp generated/reports/r48-v12-PollControls-before.c build/reports/; else echo 'WARN: optional report missing: generated/reports/r48-v12-PollControls-before.c'; fi
          if [ -f generated/reports/r48-v12-PollControls-after.c ]; then cp generated/reports/r48-v12-PollControls-after.c build/reports/; else echo 'WARN: optional report missing: generated/reports/r48-v12-PollControls-after.c'; fi
          if [ -f generated/reports/r48-v12-PollJoystickMove-before.c ]; then cp generated/reports/r48-v12-PollJoystickMove-before.c build/reports/; else echo 'WARN: optional report missing: generated/reports/r48-v12-PollJoystickMove-before.c'; fi
          if [ -f generated/reports/r48-v12-PollJoystickMove-after.c ]; then cp generated/reports/r48-v12-PollJoystickMove-after.c build/reports/; else echo 'WARN: optional report missing: generated/reports/r48-v12-PollJoystickMove-after.c'; fi
          ! grep -Eq '^[[:space:]]*else[[:space:]]*/\*' generated/rott/rt_playr.c
          ! grep -Eq '^[[:space:]]*else[[:space:]]*/\*' generated/rott/rt_playr.c

      - name: Run engine preflight
        shell: bash
        run: |
          mkdir -p build/reports
          set -o pipefail
          make preflight 2>&1 | tee build/reports/preflight.log

      - name: Generate reports
        run: |
          make reports
          cp assets/music/music-map.json build/reports/music-map.json
          cp vendor/taradino/source/.rott64-upstream-commit \
            build/reports/taradino-upstream-commit.txt

      # ROTT64_FULL_MUSIC_CACHE_V1_WAV64_RESTORE
      - name: Restore final N64 music cache
        id: music-wav64-cache
        uses: actions/cache/restore@v4
        with:
          path: filesystem/rott/music
          key: rott64-darkwar-wav64-v1-${{ hashFiles('filesystem/rott/DARKWAR.WAD', 'tools/extract_music.py', 'tools/render_music.sh', 'Makefile') }}

      - name: Cross-compile Nintendo 64 ROM
        id: n64_build
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p ci-reports
          cp -a build/reports/. ci-reports/ 2>/dev/null || true
          set +e
          set -o pipefail
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            ghcr.io/dragonminded/libdragon:latest \
            sh -lc '
              set -eux
              rm -rf /tmp/libdragon
              git clone https://github.com/DragonMinded/libdragon.git /tmp/libdragon
              git -C /tmp/libdragon fetch \
                https://github.com/meeq/libdragon.git \
                ab53eaa95272dca06c67484199113117358e2a03
              git -C /tmp/libdragon checkout \
                ab53eaa95272dca06c67484199113117358e2a03
              make -C /tmp/libdragon -j2 install tools-install
              make -j2
            ' 2>&1 | tee ci-reports/n64-build.log
          status=${PIPESTATUS[0]}
          set -e

          if python3 -c 'from pathlib import Path; p=Path("rott64-diag.z64"); d=p.read_bytes() if p.is_file() else b""; ok=len(d)>=4096 and d[:4]==bytes.fromhex("80371240"); raise SystemExit(0 if ok else 1)'; then
            sha256sum rott64-diag.z64 | tee rott64-diag.z64.sha256
            echo "diag_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "diag_built=false" >> "$GITHUB_OUTPUT"
          fi

          if python3 -c 'from pathlib import Path; p=Path("rott64.z64"); d=p.read_bytes() if p.is_file() else b""; ok=1024*1024<=len(d)<=78_000_000 and d[:4]==bytes.fromhex("80371240"); print(f"Validated {p} ({len(d)} bytes)") if ok else None; raise SystemExit(0 if ok else 1)'; then
            sha256sum rott64.z64 | tee rott64.z64.sha256
            echo "rom_built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "rom_built=false" >> "$GITHUB_OUTPUT"
          [ "$status" -ne 0 ] || status=1
          exit "$status"

      # ROTT64_FULL_MUSIC_CACHE_V1_WAV64_SAVE
      - name: Save final N64 music cache
        if: always() && steps.music-wav64-cache.outputs.cache-hit != 'true' && hashFiles('filesystem/rott/music/*.wav64') != ''
        uses: actions/cache/save@v4
        with:
          path: filesystem/rott/music
          key: rott64-darkwar-wav64-v1-${{ hashFiles('filesystem/rott/DARKWAR.WAD', 'tools/extract_music.py', 'tools/render_music.sh', 'Makefile') }}

      - name: Verify final Dark War ROM size and format
        if: always() && steps.n64_build.outputs.rom_built == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("rott64.z64")
          data = p.read_bytes()
          if len(data) < 1024 * 1024:
              raise SystemExit("Final ROM is implausibly small")
          if len(data) > 78_000_000:
              raise SystemExit(
                  f"Final ROM exceeds 78,000,000-byte limit: {len(data)}"
              )
          if data[:4] != bytes.fromhex("80371240"):
              raise SystemExit("Final ROM is not big-endian .z64")
          print(f"Final Dark War ROM: {len(data)} bytes")
          PY

      - name: Package ROTT64 r85 ROM
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f rott64.z64 || { echo 'ERROR: successful build did not produce rott64.z64'; exit 1; }
          cp -f rott64.z64 rott64-r85.z64
          sha256sum rott64-r85.z64 > rott64-r85.z64.sha256
          ls -lh rott64-r85.z64 rott64-r85.z64.sha256
      - name: Upload Dark War ROM
        if: always() && steps.n64_build.outputs.rom_built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rott64-r85-build
          path: |
            rott64-r85.z64
            rott64-r85.z64.sha256
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rott64-darkwar-r45d-build-reports
          path: |
            ci-reports/
            build/reports/
            generated/rott/.rott64-prepared
            rott64-diag.z64
            rott64-diag.z64.sha256
          if-no-files-found: warn

      - name: Mark cross-build failure
        if: steps.n64_build.outputs.rom_built != 'true'
        run: |
          exit 1
